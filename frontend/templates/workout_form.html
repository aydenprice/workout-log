{% extends "base.html" %}

{% block content %}
<h1>{{ heading }}</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">
    <p>
        <label>Exercise
            <input type="text" name="exercise" value="{{ workout.exercise if workout else '' }}" required>
        </label>
    </p>
    <p>
        <label>Sets
            <input type="number" name="sets" min="1" step="1" value="{{ workout.sets if workout else '' }}" required>
        </label>
    </p>
    <p>
        <label>Reps
            <input type="number" name="reps" min="1" step="1" value="{{ workout.reps if workout else '' }}" required>
        </label>
    </p>
    <p>
        <label>Weight
            <input type="number" name="weight" min="0" step="any" value="{{ workout.weight if workout else '' }}" required>
        </label>
    </p>
    <p>
        <label>Date
            <input type="date" name="date" value="{{ workout.date if workout else '' }}" required>
        </label>
    </p>
    <button type="submit">Save</button>
</form>

<a href="{{ url_for('index') }}">Cancel</a>
{% endblock %}
