{% extends "base.html" %}

{% block content %}
<form method="post" class="form-card">
    <h2>{{ heading }}</h2>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <div class="field">
        <label for="exercise">Exercise</label>
        <input type="text" id="exercise" name="exercise" value="{{ workout.exercise if workout else '' }}" required>
    </div>
    <div class="field">
        <label for="sets">Sets</label>
        <input type="number" id="sets" name="sets" min="1" step="1" value="{{ workout.sets if workout else '' }}" required>
    </div>
    <div class="field">
        <label for="reps">Reps</label>
        <input type="number" id="reps" name="reps" min="1" step="1" value="{{ workout.reps if workout else '' }}" required>
    </div>
    <div class="field">
        <label for="weight">Weight</label>
        <input type="number" id="weight" name="weight" min="0" step="any" value="{{ workout.weight if workout else '' }}" required>
    </div>
    <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ workout.date if workout else '' }}" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="submit-btn">Save</button>
        <a class="cancel-link" href="{{ url_for('index') }}">Cancel</a>
    </div>
</form>
{% endblock %}
