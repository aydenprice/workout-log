<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Log</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Workout Log</h1>
            <nav>
                <a href="{{ url_for('index') }}">All Workouts</a>
                <a href="{{ url_for('create_workout') }}">Add Workout</a>
            </nav>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>Workout Log</p>
        </footer>
    </div>
</body>
</html>
