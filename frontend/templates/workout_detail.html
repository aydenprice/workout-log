{% extends "base.html" %}

{% block content %}
<div class="detail-card">
    <h2>{{ workout.exercise }}</h2>
    <p class="subtitle">{{ workout.date }}</p>

    <div class="stats">
        <div class="stat">
            <span class="stat-value">{{ workout.sets }}</span>
            <span class="stat-label">Sets</span>
        </div>
        <div class="stat">
            <span class="stat-value">{{ workout.reps }}</span>
            <span class="stat-label">Reps</span>
        </div>
        <div class="stat">
            <span class="stat-value">{{ workout.weight }}</span>
            <span class="stat-label">Weight</span>
        </div>
    </div>

    <div class="form-actions">
        <a class="link-button back-link" href="{{ url_for('index') }}">Back</a>
        <a class="link-button edit-link" href="{{ url_for('edit_workout', workout_id=workout.id) }}">Edit</a>
    </div>
</div>
{% endblock %}
